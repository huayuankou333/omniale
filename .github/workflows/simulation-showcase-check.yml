name: SimulationLE showcase browser check
on:
  push:
    branches: [main]
    paths:
      - 'docs/simulation/**'
      - 'scripts/check-simulation-showcase.cjs'
      - '.github/workflows/simulation-showcase-check.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  browser-check:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            docs/simulation
            scripts/check-simulation-showcase.cjs
          sparse-checkout-cone-mode: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install pinned browser test runtime
        run: |
          npm install --no-save --package-lock=false playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Verify six pages, both model states, trajectories and mobile layout
        run: node scripts/check-simulation-showcase.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: simulationle-browser-verification
          path: artifacts/simulationle/
          retention-days: 14
