name: ALE crane case browser checks

on:
  push:
    branches: [main, 'case/ale-crane-keying*']
    paths:
      - 'docs/ale-crane-keying/**'
      - 'scripts/check-crane-browser.mjs'
      - '.github/workflows/ale-crane-case-checks.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            docs/ale-crane-keying
            scripts/check-crane-browser.mjs
          sparse-checkout-cone-mode: false
          lfs: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install browser client
        run: npm install --prefix "$RUNNER_TEMP/crane-qa" playwright
      - name: Install Chinese fonts for visual review
        run: |
          font_dir="${XDG_DATA_HOME:-$HOME/.local/share}/fonts"
          font_file="$font_dir/NotoSansCJKsc-Regular.otf"
          mkdir -p "$font_dir"
          curl --fail --location --retry 3 --connect-timeout 10 --max-time 120 \
            'https://raw.githubusercontent.com/notofonts/noto-cjk/165c01b46ea533872e002e0785ff17e44f6d97d8/Sans/OTF/SimplifiedChinese/NotoSansCJKsc-Regular.otf' \
            --output "$font_file"
          printf '%s  %s\n' '2c76254f6fc379fddfce0a7e84fb5385bb135d3e399294f6eeb6680d0365b74b' "$font_file" | sha256sum --check
          fc-cache -f "$font_dir"
          fc-match 'sans-serif:lang=zh-cn'
      - name: Check videos, synchronization, scores, traces and responsive layout
        shell: bash
        run: |
          export CRANE_PLAYWRIGHT_MODULE="$RUNNER_TEMP/crane-qa/node_modules/playwright/index.mjs"
          export CHROME_PATH="$(command -v google-chrome)"
          node scripts/check-crane-browser.mjs
      - name: Save browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ale-crane-browser-evidence
          path: crane-site-qa/
