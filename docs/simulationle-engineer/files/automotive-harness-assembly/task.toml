schema_version = "1.4"
artifacts = ["/logs/artifacts", {source="/evidence", destination="commissioning", service="lab"}]

[task]
name = "simulation-last-exam/automotive-harness-assembly"
version = "0.2.2"
description = "Commission two UR5e / 2F-85 arms for physical branched-harness assembly and selective rework under declared nominal contact assumptions."

[metadata]
case_id = "O5"
contract_version = "o5-nominal-contact-v2"
release_state = "evaluable_reference_omitted"
reference_policy = "intentionally_omitted"
reference_required_for_evaluation = false
complete_task_feasibility = "not_verified"
model_decision_turns = 500
development_wall_seconds = 7200
retry_waits_inside_development_deadline = true
category = "industrial-robotics-automotive-assembly"

[agent]
user = 1000
timeout_sec = 7200.0

[environment]
cpus = 4
memory_mb = 8192
storage_mb = 20480
network_mode = "no-network"
build_timeout_sec = 1800.0

[verifier]
environment_mode = "separate"
timeout_sec = 45000.0
user = "root"

[[verifier.collect]]
service = "main"
command = "python3 /usr/local/libexec/o5-freeze-submission.py"
user = "root"
timeout_sec = 60

[[verifier.collect]]
service = "lab"
command = "python3 /runtime/service_v2.py freeze"
user = "root"
timeout_sec = 60

[verifier.environment]
docker_image = "simulationle-o5-verifier:nominal-v2"
cpus = 4
memory_mb = 8192
storage_mb = 20480
network_mode = "no-network"
