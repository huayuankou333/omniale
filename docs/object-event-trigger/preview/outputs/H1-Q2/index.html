<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>T-ba400bcccb5c · 视听事件复核</title><style>
:root{--bg:#0e1420;--card:#192333;--line:#303f52;--muted:#a6b5c7;--text:#e9f0f8;--impact:#ffc16a;--friction:#84dbc9}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:15px system-ui,sans-serif}
main{max-width:1140px;margin:auto;padding:32px 22px 48px}h1{margin:.2em 0 .48em;font-size:clamp(24px,4vw,36px)}h2{margin:0 0 12px}
header .kicker{color:var(--friction);font-size:13px;letter-spacing:.16em}header p,.muted{color:var(--muted)}
.grid{display:grid;grid-template-columns: minmax(270px,.7fr) minmax(320px,1.3fr);gap:18px;margin:23px 0}
.panel,.event{background:var(--card);border:1px solid var(--line);border-radius:13px;overflow:hidden}
.panel img,.panel video{width:100%;display:block;background:#080c14;aspect-ratio:854/480;object-fit:contain}.panel .body{padding:13px 16px}.panel h2{font-size:17px}
button{font:inherit;cursor:pointer}button:focus-visible,a:focus-visible{outline:2px solid var(--friction);outline-offset:2px}
.controls,.filters{display:flex;gap:9px;flex-wrap:wrap;align-items:center}.controls button,.filters button{background:#253248;color:var(--text);border:1px solid #415570;border-radius:7px;padding:6px 11px}
.controls button:disabled{opacity:.45;cursor:default}.filters button[aria-pressed=true]{background:#315450;color:#e6fffa}
.events{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:12px;margin:12px 0}.event[hidden]{display:none}
.pick{position:relative;display:block;width:100%;border:0;padding:0;background:#111827}.pick img{width:100%;aspect-ratio:854/480;object-fit:cover;display:block}
.play-icon{position:absolute;bottom:8px;right:9px;border-radius:7px;background:#08111eea;color:white;padding:6px 10px}
.evtext{display:grid;padding:11px 13px 3px;gap:5px}.event.impact .badge{color:var(--impact)}.event.friction .badge{color:var(--friction)}
.confidence,.file{font-size:13px;color:var(--muted)}.file{display:inline-block;margin:6px 13px 12px;color:#bcdafc}.event.active{border-color:#61cdb7}#status{font-variant-numeric:tabular-nums}
@media(max-width:730px){.grid{grid-template-columns:1fr}main{padding:23px 13px}}
</style></head>
<body><main><header><div class="kicker">A/V REVIEW · 本地复核</div><h1>T-ba400bcccb5c · 器具声事件</h1>
<p>22.08 秒 · 0 条事件 · 自动判断，供复核</p></header>
<section class="grid"><div class="panel"><img src="target.png" alt="带框和点的目标器具参考帧"><div class="body"><h2>指定器具</h2>
<div>周围的不锈钢水槽本体，不包括水、泡沫或被洗器具</div><div class="muted">指示帧 6.00 s · 标记不代表有声</div></div></div>
<div class="panel"><video id="player" playsinline preload="none" controls></video><div class="body">
<h2 id="status" aria-live="polite">本次查询未触发</h2>
<div class="controls"><button disabled id="context">从上下文开始</button><button disabled id="jump">跳至声事件起点</button><span class="muted" id="clock"></span></div></div></div></section>
<section><h2>事件列表</h2><div class="filters"><button data-filter="all" aria-pressed="true">全部 0</button>
<button data-filter="impact" aria-pressed="false">碰撞 0</button><button data-filter="friction" aria-pressed="false">摩擦 0</button>
<a class="file" href="events.json">事件 JSON</a><a class="file" href="triggers.jsonl">触发日志</a></div>
<div class="events"><p class="muted">没有达到触发阈值的目标声事件。</p></div></section>
<footer class="muted">时间相对于原录像起点；复核片段默认包含前后各 1 秒，录像首尾处截短。</footer>
</main><script>
const v=document.getElementById('player'),status=document.getElementById('status'),jump=document.getElementById('jump'),ctx=document.getElementById('context'),clock=document.getElementById('clock');
const cards=[...document.querySelectorAll('article.event')],filters=[...document.querySelectorAll('[data-filter]')];
let selected=null;
function seek(t,play=true){if(!selected)return;v.currentTime=t;if(play)v.play().catch(()=>{});}
function choose(el){selected=el.dataset;cards.forEach(c=>c.classList.toggle('active',c.contains(el)));v.poster=selected.poster;v.src=selected.clip;
status.textContent=`声事件 ${Number(selected.start).toFixed(2)} – ${Number(selected.end).toFixed(2)} s`;jump.disabled=ctx.disabled=false;v.play().catch(()=>{});}
document.querySelectorAll('button.pick').forEach(e=>e.addEventListener('click',()=>choose(e)));
ctx.addEventListener('click',()=>seek(0));jump.addEventListener('click',()=>seek(Number(selected.offset)));
v.addEventListener('timeupdate',()=>{if(selected)clock.textContent=`原录像 ${(v.currentTime+Number(selected.start)-Number(selected.offset)).toFixed(2)} s`;});
filters.forEach(b=>b.addEventListener('click',()=>{filters.forEach(f=>f.setAttribute('aria-pressed',f===b));cards.forEach(c=>c.hidden=b.dataset.filter!=='all'&&c.dataset.class!==b.dataset.filter);}));
</script></body></html>
