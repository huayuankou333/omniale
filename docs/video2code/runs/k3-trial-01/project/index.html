<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Brick Studio</title>
<script type="importmap">{"imports":{"three":"/vendor/three/build/three.module.js","three/addons/":"/vendor/three/examples/jsm/"}}</script>
<link rel="stylesheet" href="styles.css">
</head>
<body>
<canvas id="scene"></canvas>

<!-- left mode buttons -->
<div id="modes">
  <button class="mode-btn active" id="modeBuild" data-tip="Build (b)" aria-label="Build">
    <svg viewBox="0 0 24 24"><path d="M14.5 3.5l6 6-2.5 2.5-1.5-1.5-7.8 7.8-2.9-2.9 7.8-7.8-1.6-1.6 2.5-2.5z" fill="currentColor"/><path d="M4 20l3.2-3.2 2.8 2.8L6.8 22.6 4 20z" fill="currentColor" opacity=".85"/></svg>
  </button>
  <button class="mode-btn" id="modeView" data-tip="View (v)" aria-label="View">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v18M3 12h18"/><path d="M12 3l-2.5 2.5M12 3l2.5 2.5M12 21l-2.5-2.5M12 21l2.5-2.5M3 12l2.5-2.5M3 12l2.5 2.5M21 12l-2.5-2.5M21 12l-2.5 2.5"/></svg>
  </button>
  <button class="mode-btn" id="modeErase" data-tip="Erase (e)" aria-label="Erase">
    <svg viewBox="0 0 24 24"><path d="M15.5 3.8l4.7 4.7c.6.6.6 1.5 0 2.1l-7.4 7.4H7.6l-3.5-3.5c-.6-.6-.6-1.5 0-2.1l9.3-9.3c.6-.6 1.5-.6 2.1 0z" fill="currentColor"/><rect x="3" y="19.4" width="18" height="2" rx="1" fill="currentColor"/></svg>
  </button>
</div>

<!-- top right -->
<div id="topright">
  <button class="icon-plain" aria-label="Mute">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M11 5L6.5 9H3v6h3.5L11 19V5z" fill="currentColor" stroke="none"/><path d="M16 9.5l5 5M21 9.5l-5 5"/></svg>
  </button>
  <button class="icon-plain" aria-label="Close">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>
  </button>
</div>

<!-- bottom toolbar -->
<div id="toolbar">
  <button class="tb-btn dim" data-tip="Undo" aria-label="Undo">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M8 5L3.5 9.5 8 14"/><path d="M3.5 9.5H14a6 6 0 0 1 0 12h-2"/></svg>
  </button>
  <button class="tb-btn dim" data-tip="Redo" aria-label="Redo">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M16 5l4.5 4.5L16 14"/><path d="M20.5 9.5H10a6 6 0 0 0 0 12h2"/></svg>
  </button>
  <span class="sep"></span>
  <div id="swatches"></div>
  <button class="swatch wheel" id="wheel" data-tip="Custom color" aria-label="Custom color"></button>
  <span class="sep"></span>
  <div class="dd-wrap">
    <button class="tb-btn dd" id="widthBtn" data-tip="Width ([ smaller, ] bigger)"><span id="widthVal">2</span><svg class="chev" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M6 10l6 6 6-6"/></svg></button>
    <div class="dd-menu" id="widthMenu"></div>
  </div>
  <button class="tb-btn" id="swapBtn" data-tip="Swap (s)" aria-label="Swap">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 8h13l-3-3M20 16H7l3 3"/></svg>
  </button>
  <div class="dd-wrap">
    <button class="tb-btn dd" id="depthBtn" data-tip="Depth (, smaller, . bigger)"><span id="depthVal">2</span><svg class="chev" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M6 10l6 6 6-6"/></svg></button>
    <div class="dd-menu" id="depthMenu"></div>
  </div>
  <span class="sep"></span>
  <button class="tb-btn" data-tip="Open" aria-label="Open">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V7z"/></svg>
  </button>
  <button class="tb-btn" data-tip="Save" aria-label="Save">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M5 3h11l3 3v13a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2z"/><path d="M8 3v5h7V3M7 21v-7h10v7"/></svg>
  </button>
  <span class="sep"></span>
  <button class="tb-btn" id="playBtn" data-tip="Play" aria-label="Play">
    <svg viewBox="0 0 24 24"><path d="M8 5.5v13l11-6.5-11-6.5z" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linejoin="round"/></svg>
  </button>
  <button class="tb-btn danger" id="trashBtn" data-tip="Clear" aria-label="Clear">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7h16M9 7V4h6v3M6 7l1 13a1.8 1.8 0 0 0 1.8 1.7h6.4A1.8 1.8 0 0 0 17 20l1-13"/><path d="M10 11v6M14 11v6"/></svg>
  </button>
</div>

<!-- pause shown in play mode -->
<button id="pauseBtn" aria-label="Pause"><span></span><span></span></button>

<!-- clear dialog -->
<div id="overlay" hidden>
  <div id="dialog" role="dialog" aria-modal="true">
    <button id="dlgX" aria-label="Close"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
    <h2>Clear Set</h2>
    <p>Are you sure you want to clear the entire set? This action cannot be undone.</p>
    <div class="dlg-actions">
      <button id="dlgCancel">Cancel</button>
      <button id="dlgClear">Clear</button>
    </div>
  </div>
</div>

<script type="module" src="main.js"></script>
</body>
</html>
