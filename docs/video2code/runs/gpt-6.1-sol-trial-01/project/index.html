<!doctype html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>3D Brick Studio</title><link rel="stylesheet" href="style.css"><script type="importmap">{"imports":{"three":"/vendor/three/build/three.module.js","three/addons/":"/vendor/three/examples/jsm/"}}</script></head><body>
<canvas id="studio" aria-label="3D brick building canvas"></canvas>
<div id="modes" class="modes"><button data-mode="build" class="mode active" aria-label="Build" data-tip="Build (b)" data-icon="hammer"></button><button data-mode="view" class="mode" aria-label="Manual view" data-tip="Move (m)" data-icon="move"></button><button data-mode="erase" class="mode" aria-label="Erase" data-tip="Erase (e)" data-icon="eraser"></button></div>
<button id="sound" aria-label="Sound muted" data-icon="mute"></button>
<div id="toolbar" class="toolbar" role="toolbar" aria-label="Brick tools">
<button class="tool" data-icon="undo" aria-label="Undo" data-tip="Undo" id="undo"></button><button class="tool muted" data-icon="redo" aria-label="Redo" data-tip="Redo" id="redo"></button><span class="divider"></span>
<div id="palette" class="palette"></div><span class="divider"></span><button id="rainbow" aria-label="Custom color" data-tip="Custom color" class="swatch rainbow"></button><span class="divider"></span>
<select id="width" aria-label="Width" title="Width (w)"></select><button id="swap" class="tool swap" aria-label="Swap dimensions" data-tip="Swap (s)" data-icon="swap"></button><select id="depth" aria-label="Depth" title="Depth (d)"></select><span class="divider"></span>
<button class="tool" aria-label="Open" data-tip="Open" data-icon="folder"></button><button class="tool" aria-label="Save" data-tip="Save" data-icon="save"></button><span class="divider"></span><button id="play" class="tool" aria-label="Play" data-tip="Play" data-icon="play"></button><button id="trash" class="tool trash" aria-label="Clear set" data-tip="Clear set" data-icon="trash"></button>
</div>
<button id="pause" aria-label="Pause" data-icon="pause" hidden></button>
<div id="modal" class="overlay" hidden><section class="dialog" role="dialog" aria-modal="true" aria-labelledby="dialog-title"><button id="close" class="close" aria-label="Close">×</button><h1 id="dialog-title">Clear Set</h1><p>Are you sure you want to clear the entire set? This action<br class="desktop"> cannot be undone.</p><div class="dialog-actions"><button id="cancel">Cancel</button><button id="confirm">Clear</button></div></section></div>
<script type="module" src="app.js"></script></body></html>
